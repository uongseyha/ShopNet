# Azure CI/CD: Build Angular + .NET API and deploy to Azure Web App
# API serves the Angular SPA from wwwroot (built from Client into API/wwwroot)

name: Azure CI/CD - ShopNet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: shopnet2k6
  DOTNET_VERSION: '8.x'
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build Angular client into API/wwwroot (SPA served by API)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Angular dependencies
        run: npm install
        working-directory: Client

      - name: Build Angular (production)
        run: npm run build
        working-directory: Client

      # Build and publish .NET API (includes wwwroot from Angular build)
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET API
        run: dotnet build API/API.csproj --configuration Release --no-restore

      - name: Publish .NET API
        run: dotnet publish API/API.csproj -c Release -o ./publish --no-build

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D22F0E92B9F349199F4CC5F293D99A14 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6F72EFFF98364895A66E8DB659AF24B3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A25BF19AF22B417CB71A04B8CC9D75C8 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
