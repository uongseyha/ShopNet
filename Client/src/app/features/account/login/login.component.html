<mat-card class="max-w-lg mx-auto mt-32 p-8 bg-white">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-semibold text-primary mb-4">Login</h1>
      
      <!-- Demo Credentials Info Card -->
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 text-left">
        <div class="flex items-start gap-3">
          <mat-icon class="text-blue-600 mt-0.5">info</mat-icon>
          <div class="flex-1">
            <p class="text-sm text-gray-700 mb-2">Use these credentials for demo purposes:</p>
            <div class="bg-white rounded px-3 py-2 space-y-1 font-mono text-sm">
              <div class="flex items-center gap-2">
                <span class="text-gray-500">Email:</span>
                <strong class="text-blue-700">demo@test.com</strong>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-gray-500">Password:</span>
                <strong class="text-blue-700">Pa$$w0rd</strong>
              </div>
            </div>
            <p class="text-xs text-gray-600 mt-2">Or create your own account</p>
          </div>
        </div>
      </div>
    </div>
    
    <div class="space-y-4">
      <app-text-input label="Email address" formControlName="email" type="email" />
      <app-text-input label="Password" formControlName="password" type="password" />
    </div>
    
    <button mat-flat-button type="submit" color="primary" class="w-full py-2 mt-6">
      Sign in
    </button>
  </form>
</mat-card>
