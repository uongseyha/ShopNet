<header
  class="bg-white/95 backdrop-blur-md shadow-lg fixed top-0 left-0 right-0 z-50 border-b border-gray-100"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <!-- Logo -->
      <div
        routerLink="/"
        class="flex-shrink-0 cursor-pointer transition-transform hover:scale-105 duration-200"
      >
        <img src="/images/logo.png" alt="ShopNet" class="h-12 md:h-16 w-auto" />
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-1">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="px-4 py-2 text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg font-semibold uppercase tracking-wide transition-all duration-200 text-base"
        >
          Home
        </a>
        <a
          routerLink="/shop"
          routerLinkActive="active"
          class="px-4 py-2 text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg font-semibold uppercase tracking-wide transition-all duration-200 text-base"
        >
          Shop
        </a>
      </nav>

      <!-- Desktop Actions -->
      <div class="hidden md:flex items-center space-x-3">
        <a
          routerLink="/cart"
          routerLinkActive="active"
          [matBadge]="getCartItemCount()"
          matBadgeSize="medium"
          class="custom-badge relative p-2 rounded-lg hover:bg-gray-100 transition-all duration-200 group"
        >
          <mat-icon class="text-gray-700 group-hover:text-blue-600 transition-colors"
            >shopping_cart</mat-icon
          >
        </a>

        @if (accountService.currentUser()) {
          <button
            mat-icon-button
            [matMenuTriggerFor]="userMenu"
            class="!text-gray-700 hover:!bg-gray-100 !rounded-lg"
          >
            <mat-icon>account_circle</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu">
            <button mat-menu-item routerLink="/cart">
              <mat-icon>shopping_cart</mat-icon>
              <span>My cart</span>
            </button>
            <!-- <button mat-menu-item routerLink="/orders">
              <mat-icon>receipt_long</mat-icon>
              <span>Orders</span>
            </button> -->
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        } @else {
          <button
            routerLink="/login"
            mat-stroked-button
            class="!px-6 !py-2 !border-2 !border-blue-600 !text-blue-600 hover:!bg-blue-50 !rounded-lg !font-semibold !transition-all !duration-200"
          >
            Login
          </button>
          <button
            routerLink="/register"
            mat-flat-button
            color="primary"
            class="!px-6 !py-2 !bg-blue-600 hover:!bg-blue-700 !rounded-lg !font-semibold !shadow-md hover:!shadow-lg !transition-all !duration-200"
          >
            Register
          </button>
        }
      </div>

      <!-- Mobile Actions -->
      <div class="flex md:hidden items-center space-x-2">
        <a
          routerLink="/cart"
          routerLinkActive="active"
          [matBadge]="getCartItemCount()"
          matBadgeSize="small"
          class="custom-badge-mobile relative p-2 rounded-lg hover:bg-gray-100 transition-colors"
        >
          <mat-icon class="text-gray-700">shopping_cart</mat-icon>
        </a>
        <button
          mat-icon-button
          (click)="toggleMobileMenu()"
          class="!text-gray-700 hover:!bg-gray-100 !rounded-lg !transition-colors"
          [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
          [attr.aria-expanded]="mobileMenuOpen()"
        >
          <mat-icon class="text-3xl">{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu with Smooth Animation -->
  <div
    class="md:hidden overflow-hidden transition-all duration-300 ease-in-out"
    [class.max-h-0]="!mobileMenuOpen()"
    [class.max-h-[500px]]="mobileMenuOpen()"
  >
    <nav class="bg-gradient-to-b from-gray-50 to-white border-t border-gray-200 shadow-inner">
      <div class="px-4 py-6 space-y-2">
        <!-- Navigation Links -->
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl font-medium uppercase tracking-wide transition-all duration-200 group"
          (click)="closeMobileMenu()"
        >
          <mat-icon class="text-gray-500 group-hover:text-blue-600 transition-colors"
            >home</mat-icon
          >
          <span>Home</span>
        </a>
        <a
          routerLink="/shop"
          routerLinkActive="active"
          class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl font-medium uppercase tracking-wide transition-all duration-200 group"
          (click)="closeMobileMenu()"
        >
          <mat-icon class="text-gray-500 group-hover:text-blue-600 transition-colors"
            >store</mat-icon
          >
          <span>Shop</span>
        </a>

        <!-- Divider -->
        <div class="py-2">
          <mat-divider></mat-divider>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-2 pt-2">
          @if (accountService.currentUser()) {
            <button
              routerLink="/cart"
              mat-stroked-button
              class="!w-full !py-3 !border-2 !border-gray-300 !text-gray-700 hover:!bg-gray-50 !rounded-xl !font-semibold !transition-all !duration-200"
              (click)="closeMobileMenu()"
            >
              <mat-icon class="!mr-2">shopping_cart</mat-icon>
              My cart
            </button>
            <!-- <button
              routerLink="/orders"
              mat-stroked-button
              class="!w-full !py-3 !border-2 !border-gray-300 !text-gray-700 hover:!bg-gray-50 !rounded-xl !font-semibold !transition-all !duration-200"
              (click)="closeMobileMenu()"
            >
              <mat-icon class="!mr-2">receipt_long</mat-icon>
              Orders
            </button> -->
            <button
              (click)="logout(); closeMobileMenu()"
              mat-flat-button
              color="primary"
              class="!w-full !py-3 !bg-blue-600 hover:!bg-blue-700 !rounded-xl !font-semibold !shadow-md hover:!shadow-lg !transition-all !duration-200"
            >
              <mat-icon class="!mr-2">logout</mat-icon>
              Logout
            </button>
          } @else {
            <button
              routerLink="/login"
              mat-stroked-button
              class="!w-full !py-3 !border-2 !border-blue-600 !text-blue-600 hover:!bg-blue-50 !rounded-xl !font-semibold !transition-all !duration-200"
              (click)="closeMobileMenu()"
            >
              Login
            </button>
            <button
              routerLink="/register"
              mat-flat-button
              color="primary"
              class="!w-full !py-3 !bg-blue-600 hover:!bg-blue-700 !rounded-xl !font-semibold !shadow-md hover:!shadow-lg !transition-all !duration-200"
              (click)="closeMobileMenu()"
            >
              Register
            </button>
          }
        </div>
      </div>
    </nav>
  </div>
</header>

@if (busyService.loading()) {
  <mat-progress-bar mode="indeterminate" class="fixed top-20 z-50"></mat-progress-bar>
}
